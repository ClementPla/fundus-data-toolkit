[project]
name = "fundus_data_toolkit"
version = "0.1.0"
description = "A simple interface for creating datamodules from publicly available fundus datasets"
dependencies = [
    "albumentations",
    "appdirs",
    "torch",
    "torchvision",
    "numpy",
    "opencv-python-headless",
    "pandas",
    "matplotlib",
    "pytorch-lightning",
    "nntools @ git+https://github.com/ClementPla/NNTools@attrs_dataset",
    "timm",
]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "RUF", "TC"]
fixable = ["I", "RUF100", "TC"]
fix = true

[dependency-groups]
notebook = ["ipykernel", "tqdm"]
